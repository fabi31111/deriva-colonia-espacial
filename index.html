<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DERIVA · Una ciudad entre estrellas</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><b>✦ D E R I V A</b><small>UNA CIUDAD ENTRE ESTRELLAS</small></div><div id="resources"></div><button id="sound" title="Activar música y efectos">♫ Sonido: no</button><button id="help">?</button><button id="settings" title="Guardado y reinicio">☰</button></header>
<main><canvas id="world" aria-label="Mundo de la colonia. Selecciona un edificio abajo y haz clic en la cuadrícula."></canvas><div class="sector">SECTOR 07 / CINTURÓN DE AURORA<br><span>Un nuevo lugar al que llamar hogar.</span></div><section class="mission"><small>OBJETIVO DE LA EXPEDICIÓN</small><h2>Una señal de esperanza</h2><p>Reúne a 50 habitantes y construye una antena.</p><div class="progress"><i id="progress"></i></div><span id="goal"></span><button id="research">⌘ Investigación</button><button id="explore">◇ Explorar islas</button></section><aside id="info"></aside><div id="toast" role="status" aria-live="polite"></div><div class="world-footer"><span id="clock"></span><span id="hint">Clic: inspeccionar · Arrastrar: cámara · Rueda: zoom</span><div class="controls"><button id="center" title="Centrar cámara">⌖</button><button id="zoomout">−</button><button id="zoomin">+</button><button id="pause">Ⅱ</button><button class="speed active" data-speed="1">×1</button><button class="speed" data-speed="2">×2</button><button class="speed" data-speed="4">×4</button></div></div></main>
<footer><div class="build-heading"><b>CONSTRUIR</b><span id="buildHelp">Cada piso es una posibilidad.</span><button id="cancel" hidden>Cancelar [Esc]</button></div><div id="buildings"></div></footer>
<dialog id="dialog"><button id="closeDialog" class="close" aria-label="Cerrar">×</button><div id="dialogBody"></div></dialog>
<script src="model.js"></script><script src="render.js"></script><script src="game.js"></script></body></html>
